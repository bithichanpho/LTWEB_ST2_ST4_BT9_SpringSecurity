<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">

<div class="login-card">

    <h1>UTEShop</h1>
    <h2>Đăng nhập</h2>

    <div class="alert error" th:if="${param.error}">
        Username/email hoặc password không đúng.
    </div>

    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">Username hoặc Email</label>
        <input id="username"
               type="text"
               name="username"
               placeholder="Username hoặc email"
               required
               autofocus>

        <label for="password">Password</label>
        <input id="password"
               type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Đăng nhập</button>
    </form>

    <p class="note">
        Có thể đăng nhập bằng username hoặc email.
    </p>

</div>

</body>
</html>

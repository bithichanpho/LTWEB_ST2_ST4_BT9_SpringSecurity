<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh mục</title>
</head>
<body>
<main layout:fragment="content">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Catalog</p>
            <h1>Danh mục sản phẩm</h1>
        </div>
    </div>

    <div class="category-grid">
        <article class="category-card" th:each="category : ${categories}">
            <img th:src="@{'/image/' + ${category.images}}"
                 th:alt="${category.categoryName}">
            <div>
                <h3 th:text="${category.categoryName}">Quần áo nam</h3>
                <p th:text="'Mã danh mục: ' + ${category.categoryId}">Mã danh mục</p>
            </div>
        </article>
    </div>
</main>
</body>
</html>

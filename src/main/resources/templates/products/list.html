<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Sản phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Catalog</p>
            <h1>Tất cả sản phẩm</h1>
        </div>
    </div>

    <div class="product-grid">
        <article class="product-card" th:each="product : ${products}">
            <a th:href="@{/products/{id}(id=${product.productId})}">
                <img th:src="@{'/image/' + ${product.images}}"
                     th:alt="${product.productName}">
            </a>
            <div class="product-body">
                <p class="product-category" th:text="${product.category.categoryName}">Quần áo nam</p>
                <h3 th:text="${product.productName}">Quần Jeans</h3>
                <p class="product-description" th:text="${product.description}">Mô tả</p>
                <div class="product-meta">
                    <strong th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">399,000 ₫</strong>
                    <span th:text="'Còn ' + ${product.quantity}">Còn 50</span>
                </div>
            </div>
        </article>
    </div>
</main>
</body>
</html>

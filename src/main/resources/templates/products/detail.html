<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${product.productName}">Chi tiết sản phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <section class="product-detail panel">
        <div>
            <img class="detail-image"
                 th:src="@{'/image/' + ${product.images}}"
                 th:alt="${product.productName}">
        </div>
        <div class="detail-content">
            <p class="eyebrow" th:text="${product.category.categoryName}">Danh mục</p>
            <h1 th:text="${product.productName}">Quần Jeans</h1>
            <p class="detail-price"
               th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">399,000 ₫</p>
            <p class="product-description" th:text="${product.description}">Mô tả</p>
            <p><strong>Mã sản phẩm:</strong> <span th:text="${product.productId}">P001</span></p>
            <p><strong>Số lượng:</strong> <span th:text="${product.quantity}">50</span></p>
            <p><strong>Đã bán:</strong> <span th:text="${product.sold}">0</span></p>
            <a class="btn secondary" th:href="@{/products}">← Quay lại sản phẩm</a>
        </div>
    </section>
</main>
</body>
</html>
